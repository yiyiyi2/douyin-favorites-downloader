<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>抖音收藏下载器</title>
<style>
  :root{
    /* 深空灰蓝底 + 低饱和点缀: 整体压暗但不闷, 长时间盯着不刺眼 */
    --bg:#0b0f15; --bg-soft:#0e131b;
    --panel:#141a24; --panel-2:#1b2231; --panel-3:#222c3d;
    --line:#242c3b; --line-2:#2f3949;
    --txt:#e7ecf5; --muted:#8a96ab; --muted-2:#616d82;
    --accent:#ff4d6d; --accent-2:#ff8fa3; --cool:#4fc3d9;
    --red:#ff4d6d; --cyan:#4fc3d9;            /* 旧变量名保留, 别处还在用 */
    --ok:#3ecf8e; --warn:#f2b544; --err:#ef5b6b;
    --shadow:0 14px 34px rgba(0,0,0,.42);
    --ring:0 0 0 3px rgba(79,195,217,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1100px 560px at 10% -10%, rgba(66,92,138,.20) 0%, transparent 62%),
      radial-gradient(820px 460px at 102% -8%, rgba(126,44,74,.13) 0%, transparent 58%),
      var(--bg);
    color:var(--txt); font:14px/1.55 "Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  ::selection{background:rgba(255,77,109,.28)}
  /* 细滚动条, 别抢视线 */
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#28313f;border-radius:99px;border:3px solid transparent;
    background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:#374356;background-clip:content-box}
  *::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:none;box-shadow:var(--ring)}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px 60px}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
    background:rgba(11,15,21,.78);border-bottom:1px solid var(--line);
  }
  .bar{max-width:1400px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;letter-spacing:.2px}
  .logo{width:25px;height:25px;border-radius:8px;
        background:linear-gradient(135deg,var(--accent),var(--accent-2) 52%,var(--cool));
        box-shadow:0 0 14px rgba(255,77,109,.28)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:4px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        background:rgba(20,26,36,.85);border:1px solid var(--line);color:var(--muted);font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
  .dot.on{background:var(--ok);box-shadow:0 0 7px rgba(62,207,142,.75)}
  .dot.off{background:var(--err);box-shadow:0 0 7px rgba(239,91,107,.6)}
  .grow{flex:1}
  button{
    font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);
    padding:7px 13px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap
  }
  button:hover{background:var(--panel-2);border-color:var(--line-2)}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(135deg,var(--accent),#f4586f);border-color:transparent;
    color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(255,77,109,.22)}
  button.primary:hover{filter:brightness(1.07)}
  button.ghost{background:transparent}
  button.ghost:hover{background:rgba(255,255,255,.04)}

  /* ---------- 统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px;margin:14px 0 6px}
  .stat{background:linear-gradient(180deg,var(--panel),#101620);border:1px solid var(--line);
        border-radius:13px;padding:12px 14px;position:relative;overflow:hidden}
  .stat::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;
        background:linear-gradient(90deg,rgba(255,77,109,.7),rgba(79,195,217,.45));opacity:.5}
  .stat b{display:block;font-size:22px;font-weight:700;letter-spacing:.3px;line-height:1.3}
  .stat span{color:var(--muted);font-size:11.5px}

  /* ---------- 区块 ---------- */
  h2{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1.1px;margin:18px 0 9px;
     text-transform:uppercase;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  h2.fold{cursor:pointer;user-select:none}
  h2.fold:hover{color:var(--txt)}
  h2.fold .arrow{color:var(--muted-2);font-size:10px;margin-left:7px;transition:color .15s}

  /* 正在下载 */
  .active-list{display:flex;flex-direction:column;gap:10px}
  .dl{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
      display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;
      box-shadow:0 6px 18px rgba(0,0,0,.22)}
  .dl .cover{width:52px;height:52px;border-radius:9px;background:var(--panel-2);overflow:hidden;
             display:flex;align-items:center;justify-content:center;color:#3a4356;font-size:18px;
             position:relative}
  .dl .cover img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .dl .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .dl .t{font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:center;
         font-size:13.5px;line-height:1.4}
  .dl .t em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400}
  .dl .meta{color:var(--muted);font-size:11.5px}
  .bar-bg{height:5px;border-radius:99px;background:#1b2331;margin-top:8px;overflow:hidden}
  .bar-fg{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
          transition:width .35s ease}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(79,195,217,.10);
         color:var(--cool);border:1px solid rgba(79,195,217,.22);font-weight:500}

  /* 队列: 一行一条, 序号 + 标题 + 状态, 超过一屏就滚动 */
  .queue{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .q-head{display:flex;justify-content:space-between;align-items:center;
          padding:9px 14px;font-size:11.5px;color:var(--muted);
          border-bottom:1px solid var(--line);background:rgba(255,255,255,.012)}
  .q-list{list-style:none;margin:0;padding:0;max-height:196px;overflow-y:auto}
  .q-list::-webkit-scrollbar{width:6px}
  .q-list::-webkit-scrollbar-thumb{background:#2a3444;border-radius:99px}
  .q-row{display:flex;align-items:center;gap:10px;padding:8px 14px;
         font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.035)}
  .q-row:last-child{border-bottom:0}
  .q-idx{flex:0 0 18px;text-align:right;color:#46536a;font-size:11px;
         font-variant-numeric:tabular-nums}
  .q-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;color:#c3ccd9}
  .q-tag{flex:0 0 auto;font-size:10.5px;padding:2px 8px;border-radius:999px;
         border:1px solid var(--line-2);color:var(--muted)}
  .q-tag.resolving{color:var(--cool);border-color:rgba(79,195,217,.32);
                   background:rgba(79,195,217,.09)}
  .q-more{padding:8px 14px;font-size:11.5px;color:var(--muted);
          border-top:1px solid var(--line)}

  /* 失败列表 */
  .failed-list{display:flex;flex-direction:column;gap:8px}
  .fitem{background:rgba(58,26,34,.35);border:1px solid rgba(239,91,107,.22);border-radius:12px;
         padding:11px 14px;display:flex;gap:12px;align-items:center;transition:opacity .2s}
  .fitem.busy{opacity:.72}
  .f-main{min-width:0;flex:1}
  .fitem .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .meta{color:#cf8493;font-size:11.5px;margin-top:2px}
  .f-x{flex:0 0 auto;width:26px;height:26px;line-height:1;border-radius:8px;
       background:transparent;border:1px solid var(--line-2);color:#7b8798;
       font-size:15px;cursor:pointer;padding:0}
  .f-x:hover{color:#ff8b9d;border-color:rgba(239,91,107,.42);background:rgba(239,91,107,.10)}
  button.busy{opacity:.6;cursor:default}
  .btn{padding:5px 12px;border-radius:9px;font-size:12px}
  button.danger{color:#ff8b9d;border-color:rgba(239,91,107,.22)}
  button.danger:hover{background:rgba(239,91,107,.10);border-color:rgba(239,91,107,.4)}

  /* 近 14 天柱状图 */
  .chart{display:flex;align-items:flex-end;gap:7px;height:104px;padding:8px 12px;
         background:var(--panel);border:1px solid var(--line);border-radius:13px}
  .chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
              height:100%;min-width:0;position:relative}
  .chart .fill{width:66%;max-width:30px;border-radius:5px 5px 2px 2px;
               background:linear-gradient(180deg,#ff5d7b,#8a2740);min-height:3px;
               transition:height .3s,background .15s}
  .chart .col:hover .fill{background:linear-gradient(180deg,var(--cool),#2b7f92)}
  .chart .col span{position:absolute;top:-4px;font-size:10px;color:var(--muted)}
  .chart .col em{font-style:normal;font-size:10px;color:var(--muted-2);margin-top:6px}

  /* 右键菜单 */
  #ctxmenu{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:6px;
           min-width:172px;box-shadow:0 16px 40px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
  #ctxmenu .mi{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;
               transition:background .12s}
  #ctxmenu .mi:hover{background:var(--panel-3)}
  #ctxmenu .mi.danger{color:#ff8b9d}

  /* 工具栏 */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{
    width:100%;padding:9px 12px 9px 34px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);color:var(--txt);font:inherit;outline:none;transition:.15s
  }
  .search input::placeholder{color:var(--muted-2)}
  .search input:focus{border-color:rgba(79,195,217,.45);box-shadow:var(--ring)}
  .search svg{position:absolute;left:11px;top:10px;opacity:.4}
  .search .kbd{position:absolute;right:9px;top:8px;font-size:10.5px;color:var(--muted-2);
    border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;pointer-events:none}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:1px}
  .tabs button{border:none;background:transparent;padding:6px 12px;border-radius:8px;
    color:var(--muted);font-size:13px;transition:.15s}
  .tabs button:hover{background:rgba(255,255,255,.04);color:var(--txt)}
  .tabs button.on{background:var(--panel-3);color:var(--txt);font-weight:600}
  select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:9px 10px;
    border-radius:10px;font:inherit;outline:none;cursor:pointer;transition:.15s}
  select:hover{border-color:var(--line-2)}

  /* 历史网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
        transition:transform .18s,border-color .18s,box-shadow .18s;position:relative}
  .card:hover{transform:translateY(-3px);border-color:var(--line-2);
        box-shadow:0 14px 30px rgba(0,0,0,.45)}
  /* 抖音是竖屏内容, 用 4:5 竖图才不会把画面裁掉大半 */
  .thumb{aspect-ratio:4/5;background:linear-gradient(150deg,#1a212d,#121821);position:relative;
         display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1;
             transition:transform .35s ease}
  .card:hover .thumb img{transform:scale(1.04)}
  .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             font-size:28px;font-weight:700;color:#2c3648}
  .thumb .tag{position:absolute;left:8px;top:8px;font-size:10.5px;padding:2px 7px;border-radius:6px;
              background:rgba(8,11,16,.72);color:#d5deec;backdrop-filter:blur(4px);
              border:1px solid rgba(255,255,255,.06)}
  .thumb .dur{position:absolute;right:8px;bottom:8px;font-size:10.5px;padding:2px 6px;border-radius:6px;
              background:rgba(8,11,16,.75);color:#d5deec}
  .card .body{padding:10px 11px 11px}
  .card .title{font-size:12.5px;font-weight:600;line-height:1.45;height:36px;overflow:hidden;
               display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .sub{display:flex;justify-content:space-between;gap:8px;color:var(--muted);
             font-size:11px;margin-top:6px}
  .card .sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .acts{display:flex;gap:5px;margin-top:9px;opacity:.62;transition:opacity .15s}
  .card:hover .acts,.card:focus-within .acts{opacity:1}
  .card .acts button{flex:1;padding:5px 0;font-size:11.5px;border-radius:7px;background:transparent;
    border:1px solid var(--line);color:var(--muted)}
  .card .acts button:hover{background:var(--panel-2);color:var(--txt);border-color:var(--line-2)}
  .card .acts button.danger:hover{color:#ff8b9d;border-color:rgba(239,91,107,.4);
    background:rgba(239,91,107,.08)}

  .empty{text-align:center;color:var(--muted);padding:64px 20px}
  .empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:6px}

  /* 设置抽屉 */
  .mask{position:fixed;inset:0;background:rgba(4,7,11,.6);backdrop-filter:blur(3px);
        display:none;z-index:40}
  .mask.on{display:block}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:#0d1219;
          border-left:1px solid var(--line);transform:translateX(100%);
          transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:50;
          padding:20px 22px 24px;overflow:auto;box-shadow:-18px 0 40px rgba(0,0,0,.35)}
  .drawer.on{transform:none}
  .drawer h3{margin:0 0 16px;font-size:15.5px;display:flex;align-items:center;gap:8px}
  .drawer h3::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.2px}
  .field .val{font-size:12.5px;word-break:break-all;color:#b9c4d6}
  .logbox{width:100%;height:240px;resize:vertical;background:#080c11;color:#93a2b8;
          border:1px solid var(--line);border-radius:10px;padding:10px 12px;
          font:11.5px/1.65 Consolas,"Cascadia Mono",monospace;white-space:pre;overflow:auto}
  .logbox:focus{border-color:rgba(79,195,217,.4);box-shadow:var(--ring)}
  .radios{display:grid;gap:7px}
  .radio{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);
         border-radius:10px;cursor:pointer;background:var(--panel);font-size:12.5px;transition:.15s}
  .radio:hover{border-color:var(--line-2)}
  .radio.on{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.07)}
  .radio input{accent-color:var(--accent);cursor:pointer}

  /* toast */
  .toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:#151c26;border:1px solid var(--line-2);border-left:3px solid var(--ok);
         border-radius:11px;padding:10px 14px;box-shadow:var(--shadow);min-width:220px;max-width:360px;
         animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toast .tt{font-weight:600;font-size:12.5px}
  .toast .ts{color:var(--muted);font-size:11.5px;margin-top:2px;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .conn{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#3a1520;
        border:1px solid rgba(239,91,107,.4);color:#ffb3be;padding:6px 14px;border-radius:999px;
        font-size:12px;display:none;z-index:70}
  .conn.on{display:block}

  /* 回到顶部 */
  .toTop{position:fixed;right:20px;bottom:22px;width:40px;height:40px;border-radius:50%;
         display:none;align-items:center;justify-content:center;padding:0;
         background:rgba(27,34,49,.92);border:1px solid var(--line-2);
         box-shadow:0 8px 22px rgba(0,0,0,.45);z-index:35;font-size:16px;color:var(--muted)}
  .toTop.show{display:flex}
  .toTop:hover{color:var(--txt);background:var(--panel-3)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="logo"></span> 抖音收藏下载器</div>
    <div class="chips">
      <span class="chip"><i class="dot" id="d-run"></i><span id="t-run">连接中…</span></span>
      <span class="chip"><i class="dot" id="d-br"></i><span id="t-br">浏览器</span></span>
      <span class="chip" id="t-up">—</span>
      <span class="chip" id="t-q">画质: 最高</span>
    </div>
    <div class="grow"></div>
    <button class="ghost" onclick="toggleLog(true)">设置 / 日志</button>
    <button class="primary" onclick="openWhat('folder')">下载文件夹</button>
    <button onclick="toggleDrawer(true)">设置</button>
  </div>
</header>

<div class="conn" id="conn">与后台断开，正在重连…</div>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-total">0</b><span>已下载视频</span></div>
    <div class="stat"><b id="s-today">0</b><span>今天新增</span></div>
    <div class="stat"><b id="s-size">0 MB</b><span>占用空间</span></div>
    <div class="stat"><b id="s-ok">0</b><span>本次成功</span></div>
    <div class="stat"><b id="s-skip">0</b><span>本次跳过</span></div>
    <div class="stat"><b id="s-speed">0</b><span>峰值 MB/s</span></div>
  </div>

  <div id="activeWrap" style="display:none">
    <h2>正在下载</h2>
    <div class="active-list" id="active"></div>
  </div>

  <div id="queueWrap" style="display:none">
    <h2>排队中</h2>
    <div class="queue" id="queue"></div>
  </div>

  <div id="failedWrap" style="display:none">
    <h2>下载失败 <span style="color:#4a5568;font-size:12px">点「重试」会重新抓取最新地址再下</span></h2>
    <div class="failed-list" id="failed"></div>
  </div>

  <div id="chartWrap" style="display:none">
    <h2 class="fold" onclick="toggleChart()">近 14 天下载量<span class="arrow">▸</span></h2>
    <div class="chart" id="chart" style="display:none"></div>
  </div>

  <h2 class="fold" onclick="toggleList()"><span class="arrow" id="listArrow">▾</span>下载记录 <span id="cnt" style="color:#4a5568;font-size:12px"></span></h2>
  <div id="listBody">
  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索标题、作者或视频 ID…" oninput="render()">
      <span class="kbd">/</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="on" data-f="all" onclick="setFilter('all')">全部</button>
      <button data-f="today" onclick="setFilter('today')">今天</button>
      <button data-f="near" onclick="setFilter('near')">最近 20</button>
      <button data-f="images" onclick="setFilter('images')">图文</button>
    </div>
    <select id="sort" onchange="render()">
      <option value="time">按时间</option>
      <option value="size">按大小</option>
      <option value="quality">按画质</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <b>还没有下载记录</b>去抖音点个『收藏』，这里就会实时出现
  </div>
  </div>
</div>

<div class="mask" id="mask" onclick="toggleDrawer(false)"></div>
<div class="drawer" id="drawer">
  <h3>设置</h3>
  <div class="field">
    <label>下载画质</label>
    <div class="radios" id="qualityRadios"></div>
  </div>
  <div class="field">
    <label>按作者分文件夹</label>
    <div class="radios" id="byAuthorRadios">
      <label class="radio" data-k="0"><input type="radio" name="ba" onchange="setByAuthor(0)"> 关（全部放 downloads/）</label>
      <label class="radio" data-k="1"><input type="radio" name="ba" onchange="setByAuthor(1)"> 开（downloads/作者名/）</label>
    </div>
  </div>
  <div class="field">
    <label>退出抖音后自动重新打开</label>
    <div class="radios" id="autoReopenRadios">
      <label class="radio" data-k="0"><input type="radio" name="ar" onchange="setAutoReopen(0)"> 关（关掉抖音监听自动结束）</label>
      <label class="radio" data-k="1"><input type="radio" name="ar" onchange="setAutoReopen(1)"> 开（关掉约 1 分钟后自动重新打开）</label>
    </div>
  </div>
  <div class="field">
    <label>自动下载推荐页视频 <span style="color:#8a94a6;font-weight:400;font-size:11px">（开着刷推荐页，加载到的视频自动进下载队列）</span></label>
    <div class="radios" id="autoRecRadios">
      <label class="radio" data-k="0"><input type="radio" name="auc" onchange="setAutoRec(0)"> 关（只下我收藏的）</label>
      <label class="radio" data-k="1"><input type="radio" name="auc" onchange="setAutoRec(1)"> 开（推荐页看到的都下，量大注意磁盘）</label>
    </div>
  </div>
  <div class="field">
    <label>自动翻页 <span style="color:#8a94a6;font-weight:400;font-size:11px">(自动替你往下滑，让推荐流持续出片)</span></label>
    <div class="radios" id="autoAdvRadios">
      <label class="radio" data-k="0"><input type="radio" name="aav" onchange="setAutoAdv(0)"> 关（推荐页我自己滑）</label>
      <label class="radio" data-k="1"><input type="radio" name="aav" onchange="setAutoAdv(1)"> 开（自动滑，滑到哪下到哪）</label>
    </div>
  </div>
  <div class="field">
    <label>自动翻页间隔 <span style="color:#8a94a6;font-weight:400;font-size:11px">（每隔几秒替你滑一条推荐，让推荐流持续出片）</span></label>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="gapInput" type="number" min="1" max="60" step="1" value="3"
             style="width:90px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 10px;font:12px/1.4 Consolas,monospace"
             spellcheck="false">
      <span style="color:#8a94a6;font-size:11px">秒（1~60）</span>
      <button id="gapSave" onclick="saveGap()">保存</button>
    </div>
    <div class="val" id="gapHint" style="color:#8a94a6;font-size:11px;margin-top:6px"></div>
  </div>
  <div class="field">
    <label>下载目录 <span style="color:#8a94a6;font-weight:400;font-size:11px">（改成其他盘/文件夹后，新视频就存那里）</span></label>
    <div style="display:flex;gap:8px">
      <input id="outdirInput" style="flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 10px;font:12px/1.4 Consolas,monospace" spellcheck="false">
      <button onclick="saveOutdir()">保存</button>
    </div>
    <div class="val" id="outdirHint" style="color:#8a94a6;font-size:11px;margin-top:6px"></div>
  </div>
  <div class="field">
    <label>说明</label>
    <div class="val" style="color:#8a94a6;font-size:12px;line-height:1.7">
      点收藏后自动下载最高画质、无水印版本。<br>
      画质设为 1080P/720P 可以省流量和磁盘。<br>
      重复收藏同一个视频不会重复下载。
    </div>
  </div>
  <div class="field">
    <label>运行日志 <span style="color:#8a94a6;font-weight:400;font-size:11px">（最近 200 行 · 每 3 秒刷新）</span></label>
    <textarea class="logbox" id="logbox" readonly>加载中…</textarea>
  </div>
  <button class="primary" style="width:100%" onclick="toggleDrawer(false)">完成</button>
</div>

<button class="toTop" id="toTop" title="回到顶部 (T)" onclick="goTop()">↑</button>

<div class="toasts" id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
let STATE = null, FILTER = "all", lastIds = new Set(), firstLoad = true;
let lastGridSig = "";   // 卡片墙内容指纹, 没变就不重建 DOM

function fmtSize(b){
  if(!b) return "0 MB";
  const mb = b/1048576;
  if(mb >= 1024) return (mb/1024).toFixed(2)+" GB";
  return mb.toFixed(mb<10?1:0)+" MB";
}
function fmtDur(ms){
  if(!ms) return "";
  const s = Math.round(ms/1000);
  const m = Math.floor(s/60), r = s%60;
  return m+":"+String(r).padStart(2,"0");
}
function fmtTime(ts){ if(!ts) return ""; const d=new Date(ts*1000); const p=(n)=>String(n).padStart(2,"0"); return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function fmtUp(sec){
  if(sec<60) return sec+" 秒";
  const m = Math.floor(sec/60), h = Math.floor(m/60);
  if(h) return h+" 小时 "+(m%60)+" 分";
  return m+" 分钟";
}
function ago(ts){
  if(!ts) return "";
  const d = Math.floor(Date.now()/1000 - ts);
  if(d < 60) return "刚刚";
  if(d < 3600) return Math.floor(d/60)+" 分钟前";
  if(d < 86400) return Math.floor(d/3600)+" 小时前";
  const dt = new Date(ts*1000);
  return (dt.getMonth()+1)+"/"+dt.getDate();
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function goTop(){
  // 注意: 这里必须写 window.scrollTo, 写成 scrollTo 会解析到 Element.prototype.scrollTo
  window.scrollTo({top: 0, behavior: "smooth"});
}

function toggleChart(){
  const c = $("chart"), a = document.querySelector("#chartWrap .arrow");
  if (!c) return;
  const open = c.style.display === "none";
  c.style.display = open ? "" : "none";
  if (a) a.textContent = open ? "▾" : "▸";
  if (open) drawChart();
}

function toggleList(){
  const b = $("listBody"), a = $("listArrow");
  if (!b) return;
  const open = b.style.display === "none";
  b.style.display = open ? "" : "none";
  if (a) a.textContent = open ? "▾" : "▸";
}

function thumbHtml(item){
  // 占位符永远铺在底层, 缩略图加载失败就把它自己藏起来 —— 不用往 HTML 属性里塞标签
  const ch = esc((item.author || item.title || "?").slice(0, 1));
  const ph = `<div class="ph">${ch}</div>`;
  if(!item.id) return ph;
  const src = "/api/thumb?id=" + encodeURIComponent(item.id);
  // 加载失败时自动重试(最多 15 次, 间隔递增) —— 新记录封面要等服务端去抖音现拉, 第一次容易超时
  return ph + `<img loading="lazy" src="${src}" onerror="thumbRetry(this)">`;
}

function thumbRetry(img){
  const n = (parseInt(img.dataset.rv || "0", 10)) + 1;
  if(n > 15){ img.style.display = "none"; return; }   // 约 2.5 分钟内持续重试, 服务端现场拉封面可能要十几秒
  img.dataset.rv = String(n);
  setTimeout(() => {
    if(!img.isConnected) return;
    img.style.display = "";
    img.src = img.src.split("&rv=")[0] + "&rv=" + n;
  }, Math.min(1200 * n, 8000));
}

// ---------- 渲染 ----------
function render(){
  if(!STATE) return;
  // 服务端字段缺失时兜底, 防止一条异常 SSE 把整个 render 打断
  // 后端 schema 变化/字段改名/旧版后端都可能少字段, 这里全部补齐再往下用
  STATE.status = STATE.status || {};
  STATE.counters = STATE.counters || {ok:0,skip:0,fail:0};
  STATE.failed = STATE.failed || [];
  STATE.recent = STATE.recent || [];
  STATE.waiting = STATE.waiting || [];
  STATE.active = STATE.active || [];
  STATE.quality_choices = STATE.quality_choices || {max:"最高画质","1080":"1080P 及以下","720":"720P 及以下","480":"480P 及以下"};
  STATE.total = STATE.total || 0;
  STATE.today = STATE.today || 0;
  STATE.bytes = STATE.bytes || 0;
  STATE.uptime = STATE.uptime || 0;
  STATE.max_speed = STATE.max_speed || 0;
  STATE.out_dir = STATE.out_dir || "";
  STATE.quality = STATE.quality || "max";
  const st = STATE.status || {};
  $("d-run").className = "dot " + (st.running ? "on" : "off");
  $("t-run").textContent = st.running ? "监听中" : "已停止";
  const br = st.browser || "";
  $("d-br").className = "dot " + (br ? "on" : "off");
  $("t-br").textContent = br ? "浏览器已连接" : "浏览器未连接";
  $("t-up").textContent = "已运行 " + fmtUp(STATE.uptime||0);
  $("t-q").textContent = "画质: " + (STATE.quality_choices[STATE.quality] || STATE.quality);

  $("s-total").textContent = STATE.total;
  $("s-today").textContent = STATE.today;
  $("s-size").textContent = fmtSize(STATE.bytes);
  $("s-ok").textContent = STATE.counters.ok;
  $("s-skip").textContent = STATE.counters.skip;
  $("s-speed").textContent = (STATE.max_speed||0).toFixed(1);

  // 正在下载
  const act = STATE.active || [];
  $("activeWrap").style.display = act.length ? "" : "none";
  $("active").innerHTML = act.map(a=>{
    const pct = a.total ? (a.pct || 0) : 0;
    const unknow = !a.total;   // 部分播放地址不给 Content-Length, 只能显示已下多少
    const sp = a.speed ? (a.speed/1048576).toFixed(1)+" MB/s" : "";
    const left = a.total && a.speed ? Math.max(0, (a.total-a.done)/a.speed) : 0;
    return `<div class="dl">
      <div class="cover">${thumbHtml(a)}</div>
      <div>
        <div class="t">${esc(a.title||a.id)} ${a.quality?`<span class="badge">${esc(a.quality)}</span>`:""}</div>
        <div class="meta">${esc(a.author||"")} · ${fmtSize(a.done)} / ${a.total?fmtSize(a.total):"?"}
          ${sp?" · "+sp:""}${left?" · 剩余 "+Math.ceil(left)+"s":""}</div>
        <div class="bar-bg"><div class="bar-fg" style="width:${unknow?100:pct}%${unknow?";opacity:.3":""}"></div></div>
      </div>
      <div style="font-size:${unknow?"13px":"20px"};font-weight:700;color:${pct>=100?"var(--ok)":"var(--cool)"}">${unknow?fmtSize(a.done):pct.toFixed(0)+"%"}</div>
    </div>`;
  }).join("");

  // 队列: 一行一条, 带序号和状态; 一次最多铺 12 行, 多的折叠成一句提示
  const wait = STATE.waiting || [];
  $("queueWrap").style.display = wait.length ? "" : "none";
  if(wait.length){
    const shown = wait.slice(0, 12);
    const rest = wait.length - shown.length;
    $("queue").innerHTML =
      `<div class="q-head"><span>共 ${wait.length} 条</span><span>按收藏顺序依次下载</span></div>`
      + `<ol class="q-list">`
      + shown.map((w,i)=>{
          const resolving = (w.source === "解析中");
          const tail = String(w.id || "").slice(-6);
          const label = w.title || (w.author ? `${w.author} 的视频` : `视频 …${tail}`);
          return `<li class="q-row">
            <span class="q-idx">${i+1}</span>
            <span class="q-title" title="${esc(w.title || label)}">${esc(label)}</span>
            <span class="q-tag ${resolving ? "resolving" : ""}">${resolving ? "解析中" : "排队"}</span>
          </li>`;
        }).join("")
      + `</ol>`
      + (rest > 0 ? `<div class="q-more">还有 ${rest} 条在排队…</div>` : "");
  }

  // 失败列表
  const fails = STATE.failed || [];
  $("failedWrap").style.display = fails.length ? "" : "none";
  $("failed").innerHTML = fails.map(f=>{
    const busy = !!f.retrying;
    const label = f.title || `视频 …${String(f.id || "").slice(-6)}`;
    return `<div class="fitem${busy ? " busy" : ""}">
       <div class="f-main">
         <div class="t" title="${esc(label)}">${esc(label)}</div>
         <div class="meta">${esc(f.why || "未知原因")} · ${fmtTime(f.time)}</div>
       </div>
       <button class="btn${busy ? " busy" : ""}" ${busy ? "disabled" : ""}
               onclick="retryDl('${idq(f.id)}')">${busy ? "重试中…" : "重试"}</button>
       <button class="f-x" title="忽略这条（不删文件）"
               onclick="dismissFail('${idq(f.id)}')">×</button>
     </div>`;
  }).join("");

  // 近 14 天柱状图
  drawChart(STATE.recent || []);

  // 历史
  let list = (STATE.recent||[]).slice();
  const q = $("q").value.trim().toLowerCase();
  if(q) list = list.filter(x => (x.title||"").toLowerCase().includes(q)
                             || (x.author||"").toLowerCase().includes(q)
                             || (x.id||"").includes(q));
  if(FILTER==="today"){
    const t0 = new Date(); t0.setHours(0,0,0,0);
    list = list.filter(x => (x.time||0) >= t0.getTime()/1000);
  } else if(FILTER==="near"){
    list = list.slice(0,20);
  } else if(FILTER==="images"){
    list = list.filter(x => x.type==="images");
  }
  const sort = $("sort").value;
  if(sort==="size") list.sort((a,b)=>(b.size||0)-(a.size||0));
  if(sort==="quality") list.sort((a,b)=>pxOf(b.quality)-pxOf(a.quality));

  $("cnt").textContent = list.length ? `(${list.length})` : "";
  // 只有内容真的变了才重建卡片墙 —— 否则每秒一次推送都会重绘 150+ 张卡,
  // 鼠标悬停、双击、刚点开的重试都会被打断, 图片也会重新闪一下
  const sig = list.map(x=>[x.id,x.size,x.time,x.quality,x.title,x.type,x.cover].join("|")).join(";");
  if(sig !== lastGridSig){
    lastGridSig = sig;
  $("grid").innerHTML = list.map(x=>`
    <div class="card" id="card-${idq(x.id)}" ondblclick="openWhat('file','${idq(x.id)}')" oncontextmenu="showMenu(event,'${idq(x.id)}');return false">
      <div class="thumb">
        ${thumbHtml(x)}
        ${x.type==="images"?`<span class="tag">图文</span>`:""}
        ${x.quality && x.type!=="images"?`<span class="tag">${esc(x.quality)}</span>`:""}
        ${x.duration?`<span class="dur">${fmtDur(x.duration)}</span>`:""}
      </div>
      <div class="body">
        <div class="title">${esc(x.title || x.file || x.id)}</div>
        <div class="sub"><span>${esc(x.author||"—")} · ${ago(x.time)}</span><span>${fmtSize(x.size)}</span></div>
        <div class="acts">
          <button onclick="openWhat('file','${idq(x.id)}')">打开</button>
          <button onclick="openWhat('reveal','${idq(x.id)}')">定位</button>
          <button onclick="copyLink('${idq(x.id)}')">链接</button>
          <button class="danger" onclick="delRec('${idq(x.id)}')">删除</button>
        </div>
      </div>
    </div>`).join("");
  }
  $("empty").style.display = list.length ? "none" : "";

  // 新完成 -> 提示
  const ids = new Set((STATE.recent||[]).map(x=>x.id));
  if(!firstLoad){
    (STATE.recent||[]).slice(0,5).forEach(x=>{
      if(!lastIds.has(x.id)) toast(x.title||x.id, "下载完成 · " + fmtSize(x.size));
    });
  }
  lastIds = ids; firstLoad = false;

  // 设置里的画质单选项
  if(!$("qualityRadios").dataset.ready){
    $("qualityRadios").innerHTML = Object.entries(STATE.quality_choices).map(([k,v])=>
      `<label class="radio ${k===STATE.quality?"on":""}" data-k="${k}">
         <input type="radio" name="q" ${k===STATE.quality?"checked":""} onchange="setQuality('${k}')"> ${v}
       </label>`).join("");
    $("qualityRadios").dataset.ready = "1";
  }
  const oi = $("outdirInput");
  if(oi && document.activeElement !== oi) oi.value = STATE.out_dir || "";
  const oh = $("outdirHint");
  if(oh) oh.textContent = STATE.out_dir_configured
    ? "当前是自定义目录; 清空保存即恢复默认 " + (STATE.out_dir||"")
    : "";

  // 「按作者分文件夹」单选状态
  if(!$("byAuthorRadios").dataset.ready){
    const on = STATE.by_author ? 1 : 0;
    [...$("byAuthorRadios").children].forEach(l=>{
      l.classList.toggle("on", +l.dataset.k === on);
      l.querySelector("input").checked = (+l.dataset.k === on);
    });
    $("byAuthorRadios").dataset.ready = "1";
  } else {
    const on = STATE.by_author ? 1 : 0;
    [...$("byAuthorRadios").children].forEach(l=>l.classList.toggle("on", +l.dataset.k === on));
  }
  // 「退出抖音后自动重新打开」单选状态
  if(!$("autoReopenRadios").dataset.ready){
    const on = (STATE.auto_reopen !== false) ? 1 : 0;
    [...$("autoReopenRadios").children].forEach(l=>{
      l.classList.toggle("on", +l.dataset.k === on);
      l.querySelector("input").checked = (+l.dataset.k === on);
    });
    $("autoReopenRadios").dataset.ready = "1";
  } else {
    const on = (STATE.auto_reopen !== false) ? 1 : 0;
    [...$("autoReopenRadios").children].forEach(l=>l.classList.toggle("on", +l.dataset.k === on));
  }
  // 自动翻页开关
  {
    const on = STATE.auto_adv ? 1 : 0;
    [...$("autoAdvRadios").children].forEach(l=>{
      l.classList.toggle("on", +l.dataset.k === on);
      l.querySelector("input").checked = (+l.dataset.k === on);
    });
  }
  // 自动翻页间隔
  {
    const gi = $("gapInput");
    if(gi && document.activeElement !== gi) gi.value = Math.round(STATE.auto_gap || 3);
    const gh = $("gapHint");
    if(gh) gh.textContent = !STATE.auto_rec ? "（自动下推荐开着时才生效）"
                        : (STATE.auto_adv ? `当前每 ${Math.round(STATE.auto_gap||3)} 秒翻一条` : "（自动翻页已关，不会主动滑页面）");
  }
  // 「自动下载推荐页视频」单选状态
  {
    const on = STATE.auto_rec ? 1 : 0;
    [...$("autoRecRadios").children].forEach(l=>{
      l.classList.toggle("on", +l.dataset.k === on);
      l.querySelector("input").checked = (+l.dataset.k === on);
    });
  }
}

// 近 14 天下载量柱状图(纯 CSS)
function drawChart(recent){
  // toggleChart() 展开时会无参调用, 这里回退到 STATE.recent 别把有数据的图表画空
  if(!recent) recent = (STATE && STATE.recent) || [];
  const days = [];
  const now = new Date(); now.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){
    const t0 = now.getTime()/1000 - i*86400;
    days.push({t0, t1:t0+86400, n:0});
  }
  (recent||[]).forEach(x=>{
    const d = days.find(d=>(x.time||0)>=d.t0 && (x.time||0)<d.t1);
    if(d) d.n++;
  });
  const max = Math.max(1, ...days.map(d=>d.n));
  // 没有任何记录时保持 #chartWrap 隐藏, 别显示一个空图表
  $("chartWrap").style.display = (recent && recent.length) ? "" : "none";
  $("chart").innerHTML = days.map(d=>{
    const h = Math.round(d.n/max*100);
    return `<div class="col" title="${new Date(d.t0*1000).getMonth()+1}/${new Date(d.t0*1000).getDate()}: ${d.n} 个">
      <div class="fill" style="height:${Math.max(d.n?8:2,h)}%"></div>
      <span>${d.n||""}</span><em>${new Date(d.t0*1000).getMonth()+1}/${new Date(d.t0*1000).getDate()}</em>
    </div>`;
  }).join("");
}

// ---------- 网络 ----------
// 面板所有写操作都走这里: 后台重启/网络断开时不会抛 unhandled rejection, 用户也能看到提示
async function api(path, body){
  try{
    const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                                 body: JSON.stringify(body || {})});
    return await r.json();
  }catch(e){
    toast("面板和后台断开了", "看下程序是不是被关了, 页面会自动重连");
    return {ok:false};
  }
}

// 画质排序用: "1080x1920" -> 2073600。按字符串比会把 720x1280 排到 1080x1920 前面
function pxOf(q){
  const m = String(q||"").match(/(\d{2,5})\s*[x×*]\s*(\d{2,5})/);
  return m ? (+m[1]) * (+m[2]) : 0;
}

// 卡片和右键菜单的 id 会拼进 onclick 属性, 统一过白名单, 免得脏数据把属性截断
function idq(v){ return String(v==null?"":v).replace(/[^0-9A-Za-z_-]/g, ""); }

// 失败重试
async function retryDl(aid){
  const f = (STATE.failed||[]).find(x=>String(x.id)===String(aid));
  if(f && f.retrying){ toast("正在重试中", "这条还在抓地址，等它出结果"); return; }
  const j = await api("/api/retry", {id: aid});
  if(j.ok) toast("已重新抓取", "拿到最新地址后会自动排队下载");
  else toast("重试失败", "这条可能已删除/私密，或者面板与后台断开");
}

// 叉掉一条失败记录(只从列表里移掉, 不动已下载的文件)
async function dismissFail(aid){
  const j = await api("/api/fail/dismiss", {id: aid});
  toast(j.ok ? "已忽略" : "这条已经不在了",
        j.ok ? "只是从失败列表里移掉，文件没动" : "可能刚刚重试成功，已经被摘掉");
}

// 删除记录(文件+记录一起删)
async function delRec(aid){
  if(!confirm("确定删除这个视频的文件和下载记录吗？")) return;
  const j = await api("/api/delete", {id: aid});
  toast(j.ok ? "已删除" : "删除失败", j.ok ? "文件和记录都清掉了" : "文件可能已经不在了");
}

// 设置: 退出抖音后是否自动重新打开

// 设置: 自动下载推荐页视频
async function setAutoRec(v){

  if(!j.ok) return;

        v ? "刷推荐页时加载到的视频会自动进下载队列" : "回到只下收藏的模式");

// 设置: 自动翻页开关
async function setAutoAdv(v){
  const j = await api("/api/settings", {auto_adv: !!v});
  if(!j.ok) return;
  if(STATE) STATE.auto_adv = !!v;
  [...$("autoAdvRadios").children].forEach(l=>l.classList.toggle("on", +l.dataset.k === v));
  toast(v ? "已开启自动翻页" : "已关闭自动翻页",
        v ? "程序会按间隔替你往下滑推荐流" : "只在你自己滑页面时抓取推荐视频");
}

// 设置: 自动翻页间隔(秒)
async function saveGap(){
  const el = $("gapInput");
  let v = parseInt(el && el.value, 10);
  if(!Number.isFinite(v)) v = 3;
  v = Math.max(1, Math.min(60, v));
  if(el) el.value = v;
  const j = await api("/api/settings", {auto_gap: v});
  if(!j.ok) return;
  if(STATE) STATE.auto_gap = v;
  toast(`翻页间隔已设为 ${v} 秒`, v <= 5 ? "节奏较快，注意别把页面刷崩" : "慢一点更稳，磁盘压力也小");
}

// 右键菜单
function showMenu(ev, aid){
  ev.preventDefault();
  closeMenu();
  const m = document.createElement("div");
  m.id = "ctxmenu";
  m.style.cssText = "position:fixed;left:" + Math.min(ev.clientX, innerWidth-180) + "px;top:"
                  + Math.min(ev.clientY, innerHeight-170) + "px;z-index:999";
  m.innerHTML = `
    <div class="mi" onclick="openWhat('file','${aid}');closeMenu()">▶ 打开视频</div>
    <div class="mi" onclick="openWhat('reveal','${aid}');closeMenu()">📁 打开所在文件夹</div>
    <div class="mi" onclick="copyLink('${aid}');closeMenu()">🔗 复制视频链接</div>
    <div class="mi danger" onclick="delRec('${aid}');closeMenu()">🗑 删除记录和文件</div>`;
  document.body.appendChild(m);
}
function closeMenu(){
  const old = document.getElementById("ctxmenu");
  if(old) old.remove();
}
document.addEventListener("click", e=>{ if(!e.target.closest("#ctxmenu")) closeMenu(); });

function toast(title, sub){
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="tt">${esc(title)}</div><div class="ts">${esc(sub)}</div>`;
  $("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.remove(),300); }, 4200);
}

// ---------- 交互 ----------
function setFilter(f){
  FILTER = f;
  [...$("tabs").children].forEach(b=>b.classList.toggle("on", b.dataset.f===f));
  render();
}
function toggleDrawer(on){
  $("drawer").classList.toggle("on", on);
  $("mask").classList.toggle("on", on);
  if(on) pullLog();   // 打开就立刻拉一次, 不用等 3 秒轮询
}
function toggleLog(on){
  // 顶栏「设置 / 日志」: 打开右侧设置抽屉(运行日志在抽屉底部)
  toggleDrawer(!!on);
}
async function openWhat(what, id){
  const j = await api("/api/open", {what, id});
  if(!j.ok) toast(j.error || "操作失败");
}
function copyLink(id){
  const u = "https://www.douyin.com/video/" + id;
  const done = ()=>toast("已复制链接", u);
  const fail = ()=>toast("复制失败, 请手动复制", u);
  // 非安全上下文/拒绝授权时 navigator.clipboard 可能不存在或 writeText 会 reject
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(done).catch(()=>{
      // execCommand 回退: 老浏览器或 http 环境
      const ta = document.createElement("textarea");
      ta.value = u; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try{ ok = document.execCommand("copy"); }catch(_){}
      ta.remove();
      ok ? done() : fail();
    });
  } else {
    fail();
  }
}
async function setQuality(k){
  const j = await api("/api/settings", {quality:k});
  if(!j.ok){ toast(j.error || "操作失败"); return; }
  [...$("qualityRadios").children].forEach(l=>l.classList.toggle("on", l.dataset.k===k));
  toast("已切换画质", STATE.quality_choices[k]);
}

// 设置: 下载目录(可存到其他盘/文件夹)
async function saveOutdir(){
  const v = ($("outdirInput").value || "").trim();
  const j = await api("/api/settings", {out_dir: v});
  if(!j.ok){ toast("目录没保存", j.error || "目录建不出来或不可写"); return; }
  // 用后端回传的 settings 当准: 清空(恢复默认)时 out_dir 会被删掉,
  // 这时不能再拿改动前的 STATE.out_dir 提示旧目录, 直接按默认值提示
  const saved = j.settings || {};
  const dir = saved.out_dir || "downloads/";
  if(STATE) STATE.out_dir = saved.out_dir ? dir : "";
  toast(v ? "下载目录已更新" : "已恢复默认目录",
        "新下载的视频会存到: " + dir);
}

// ---------- 快捷键与滚动 ----------
// "/" 或 Ctrl+K 直接跳到搜索框, Esc 一层层退出(菜单 -> 抽屉), 省得摸鼠标
document.addEventListener("keydown", (e)=>{
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if((e.key === "/" && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k")){
    e.preventDefault();
    $("q").focus();
    $("q").select();
    return;
  }
  if((e.key === "t" || e.key === "T") && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault(); goTop(); return;
  }
  if(e.key === "Escape"){
    if(document.getElementById("ctxmenu")){ closeMenu(); return; }
    if($("drawer").classList.contains("on")){ toggleDrawer(false); return; }
    if(typing && $("q").value){ $("q").value = ""; render(); }
  }
});

// 滚过一屏才显示"回到顶部", 免得一直挂在角上碍事
addEventListener("scroll", ()=>{
  $("toTop").classList.toggle("show", scrollY > innerHeight * 0.8);
}, {passive:true});

// ---------- 实时连接 ----------
// 重入保护: 网络抖动会连着触发 onerror, 别叠加多个 EventSource 和定时器
let es = null, retryTimer = null, connecting = false;
function connect(){
  if(connecting) return;
  clearTimeout(retryTimer); retryTimer = null;
  const oldEs = es;
  if(oldEs) oldEs.close();
  connecting = true;
  const myEs = new EventSource("/api/events");
  es = myEs;
  myEs.onopen = ()=>{
    if(es !== myEs) return;       // 旧连接的迟到回调, 别动新连接状态
    connecting = false;
    $("conn").classList.remove("on");
  };
  myEs.onmessage = (e)=>{
    if(es !== myEs) return;
    $("conn").classList.remove("on");
    try{ STATE = JSON.parse(e.data); render(); }
    catch(err){ console.error(err); toast("状态解析失败", "后端数据异常, 已保留上一次画面"); }
  };
  myEs.onerror = ()=>{
    if(es !== myEs) return;       // 已关闭的旧连接再报错, 忽略, 不重复排重连
    connecting = false;
    $("conn").classList.add("on");
    myEs.close(); es = null;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, 1500);
  };
}
connect();

// 日志
async function pullLog(){
  const box = $("logbox");
  if(!box) return;
  try{
    const r = await fetch("/api/log?lines=200");
    const d = await r.json();
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.textContent = (d.lines || []).join("\n");
    if(atBottom) box.scrollTop = box.scrollHeight;
  }catch(_){}
}
setInterval(()=>{
  if($("drawer").classList.contains("on")) pullLog();
}, 3000);
</script>
