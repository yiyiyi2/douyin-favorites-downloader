<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>离线抖音 · 本地播放器</title>
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --dim:rgba(255,255,255,.62);
    --pink:#fe2c55;
    --cyan:#25f4ee;
    --panel:rgba(18,18,20,.92);
    --line:rgba(255,255,255,.08);
    --grid-w:286px;
    /* 网格展开时把右侧控件让开, 否则点赞栏/进度条被网格盖住点不到 */
    --goff:0px;
  }
  body:not(.grid-off){--goff:var(--grid-w)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    color:var(--fg);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",
      system-ui,-apple-system,sans-serif;
    user-select:none;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* ---------- 主舞台 ---------- */
  #stage{
    position:fixed;top:0;left:0;right:var(--goff);bottom:0;
    overflow-y:scroll;overflow-x:hidden;
    scroll-snap-type:y mandatory;scrollbar-width:none;
    overscroll-behavior:contain;
    transition:right .26s cubic-bezier(.4,0,.2,1);
  }
  #stage::-webkit-scrollbar{display:none}
  .slide{
    position:relative;width:100%;height:100%;scroll-snap-align:start;
    scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .slide video{
    width:100%;height:100%;object-fit:contain;background:#000;
    display:block;
  }
  .slide.paused .glass{opacity:1}
  .glass{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .18s;
  }
  .glass svg{width:74px;height:74px;filter:drop-shadow(0 2px 12px rgba(0,0,0,.7));opacity:.9}

  /* ---------- 右侧操作栏 ---------- */
  /* 注意: .rail/.meta/.bar 都在 .slide 里, 而 #stage 已经用
     right:var(--goff) 给网格让出了位置。这里千万不能再加 --goff,
     否则打开网格时会被推两次、跑到视频中间去。 */
  .rail{
    position:absolute;right:12px;bottom:118px;display:flex;flex-direction:column;
    gap:20px;align-items:center;z-index:6;
    transition:right .26s cubic-bezier(.4,0,.2,1);
  }
  .rail .act{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font-size:11px;color:var(--dim);transition:transform .12s;
  }
  .rail .act:active{transform:scale(.88)}
  .rail .act svg{width:34px;height:34px;filter:drop-shadow(0 1px 6px rgba(0,0,0,.8))}
  .rail .act.on{color:var(--pink)}
  .rail .act.on svg{color:var(--pink)}
  .rail .act.on.fav{color:#ffc53d}
  .rail .act.on.fav svg{color:#ffc53d}
  .rail .act .n{font-variant-numeric:tabular-nums;font-size:12px;color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.9)}

  /* 头像 */
  .avatar{
    width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#fe2c55,#25f4ee);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
    color:#000;border:2px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.6);
  }

  /* ---------- 左下信息 ---------- */
  .meta{
    position:absolute;left:14px;right:92px;bottom:72px;z-index:6;
    text-shadow:0 1px 8px rgba(0,0,0,.95);pointer-events:none;
    transition:right .26s cubic-bezier(.4,0,.2,1);
  }
  .meta .who{display:flex;align-items:center;gap:8px;margin-bottom:8px;pointer-events:auto}
  .meta .who b{font-size:16px;font-weight:600}
  .meta .follow{
    font-size:11px;border:1px solid rgba(255,255,255,.6);border-radius:4px;
    padding:2px 8px;color:#fff;pointer-events:auto;
  }
  .meta .follow.on{background:rgba(255,255,255,.2);border-color:transparent;color:var(--dim)}
  .meta .desc{
    font-size:13.5px;line-height:1.5;max-height:4.5em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    margin-bottom:8px;pointer-events:auto;cursor:pointer;
  }
  .meta .desc.open{-webkit-line-clamp:unset;max-height:none}
  .meta .desc .tag{color:var(--cyan)}
  .meta .music{
    display:flex;align-items:center;gap:6px;font-size:12px;color:#fff;opacity:.92;
    pointer-events:auto;max-width:100%;
  }
  .meta .music span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .music svg{width:14px;height:14px;flex:0 0 auto;animation:spin 4s linear infinite}
  .meta .music.pause svg{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  .meta .badge{
    display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:3px;
    background:rgba(255,255,255,.16);margin-right:6px;vertical-align:1px;
  }

  /* ---------- 进度条 ---------- */
  .bar{
    position:absolute;left:0;right:0;bottom:0;height:22px;z-index:8;
    display:flex;align-items:flex-end;cursor:pointer;padding-bottom:2px;
    transition:right .26s cubic-bezier(.4,0,.2,1);
  }
  .bar .track{position:relative;width:100%;height:3px;background:rgba(255,255,255,.22)}
  .bar .buf{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,255,255,.3)}
  .bar .done{position:absolute;inset:0 auto 0 0;width:0;background:var(--pink)}
  .bar .knob{
    position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%) scale(0);transition:transform .12s;
    box-shadow:0 0 6px rgba(0,0,0,.6);
  }
  .bar:hover .knob,.bar.drag .knob{transform:translate(-50%,-50%) scale(1)}
  .bar:hover .track,.bar.drag .track{height:5px}
  .bar .time{
    position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--dim);
    font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000;pointer-events:none;
  }

  /* ---------- 顶栏 ---------- */
  .top{
    position:absolute;top:0;left:0;right:var(--goff);height:54px;z-index:9;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
    transition:right .26s cubic-bezier(.4,0,.2,1);
  }
  .top .brand{font-size:14px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;gap:7px}
  .top .brand i{width:7px;height:7px;border-radius:50%;background:var(--pink);
    box-shadow:0 0 8px var(--pink);display:inline-block}
  .top .grow{flex:1}
  .top .tbtn{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  }
  .top .tbtn:hover{background:rgba(255,255,255,.2)}
  .top .tbtn svg{width:18px;height:18px}
  .top .tbtn.on{background:var(--pink)}
  .top .cnt{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---------- 右侧 3×N 预览网格 ---------- */
  #grid{
    position:fixed;top:0;right:0;bottom:0;width:var(--grid-w);z-index:20;
    background:var(--panel);backdrop-filter:blur(18px);
    border-left:1px solid var(--line);display:flex;flex-direction:column;
    transform:translateX(0);transition:transform .26s cubic-bezier(.4,0,.2,1);
  }
  #grid.hide{transform:translateX(100%)}
  #grid .ghead{
    padding:12px 12px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #grid .ghead .row1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  #grid .ghead .row1 b{font-size:13px}
  #grid .ghead .row1 .n{font-size:11px;color:var(--dim);margin-left:auto;
    font-variant-numeric:tabular-nums}
  #grid .search{
    width:100%;height:30px;border-radius:7px;background:rgba(255,255,255,.08);
    border:1px solid transparent;color:#fff;font-size:12.5px;padding:0 9px;outline:none;
  }
  #grid .search:focus{border-color:rgba(254,44,85,.5);background:rgba(255,255,255,.11)}
  #grid .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  #grid .chip{
    font-size:11px;padding:3px 9px;border-radius:11px;background:rgba(255,255,255,.09);
    color:var(--dim);transition:.15s;
  }
  #grid .chip.on{background:#fff;color:#000;font-weight:600}
  /* 第二行是"标记"维度, 和平台维度正交(可同时生效) */
  #grid .flags{margin-top:5px;padding-top:6px;border-top:1px solid var(--line)}
  #grid .chip.flag.on{background:var(--pink);color:#fff}
  #grid .chip.flag[data-f="fav"].on{background:#ffc53d;color:#000}
  #grid .chip.flag[data-f="follow"].on{background:var(--cyan);color:#000}
  #grid .chip .cn{font-size:10px;opacity:.72;font-variant-numeric:tabular-nums}
  #grid .gbody{
    flex:1;overflow-y:auto;overflow-x:hidden;padding:9px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:start;
  }
  #grid .gbody::-webkit-scrollbar{width:6px}
  #grid .gbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .card{
    position:relative;border-radius:7px;overflow:hidden;background:#222;
    /* 不用 aspect-ratio: grid item 上它不参与行高计算, 会形成
       "行高取决于高度、高度取决于行高" 的循环 -> 行高塌成 22px, 卡片互相
       压在一起(实测 y=114/143/172, 高 150)。用 padding 撑高就绝对可靠。 */
    height:0;padding-bottom:177.78%;            /* 9:16 */
    cursor:pointer;outline:2px solid transparent;
    transition:outline-color .12s,transform .12s;
  }
  .card:hover{transform:translateY(-1px)}
  .card.cur{outline-color:var(--pink)}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  /* 覆盖层不吃鼠标事件 —— 否则点在角标/文案上被它们截走, 卡片本身收不到 click */
  .card .ph,.card .lb,.card .dur,.card .idx,.card .plat{pointer-events:none}
  .card .ph{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#2a2a2e,#161618);font-size:19px;color:#4a4a52;
  }
  .card .lb{
    position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;
    background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);
    font-size:10px;line-height:1.25;color:#fff;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .dur{
    position:absolute;right:4px;top:4px;font-size:9.5px;padding:1px 4px;border-radius:3px;
    background:rgba(0,0,0,.62);font-variant-numeric:tabular-nums;
  }
  .card .idx{
    position:absolute;left:4px;top:4px;font-size:9.5px;padding:1px 5px;border-radius:3px;
    background:rgba(0,0,0,.62);font-variant-numeric:tabular-nums;color:var(--dim);
  }
  .card .plat{
    position:absolute;right:4px;bottom:4px;width:13px;height:13px;border-radius:3px;
    font-size:9px;display:flex;align-items:center;justify-content:center;color:#000;
    font-weight:700;
  }

  /* 折叠把手（贴在网格左侧边缘） */
  #toggle{
    position:fixed;top:50%;right:var(--grid-w);transform:translateY(-50%);z-index:21;
    width:22px;height:74px;border-radius:8px 0 0 8px;background:var(--panel);
    border:1px solid var(--line);border-right:0;display:flex;align-items:center;
    justify-content:center;transition:right .26s cubic-bezier(.4,0,.2,1),background .15s;
  }
  #toggle:hover{background:#26262a}
  #toggle svg{width:13px;height:13px;transition:transform .26s;color:var(--dim)}
  body.grid-off #toggle{right:0}
  body.grid-off #toggle svg{transform:rotate(180deg)}

  /* ---------- 评论抽屉 ---------- */
  #cmt{
    position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:30;
    background:#141416;border-radius:16px 16px 0 0;border-top:1px solid var(--line);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  #cmt.open{transform:translateY(0)}
  #cmt .ch{
    display:flex;align-items:center;padding:13px 15px 9px;border-bottom:1px solid var(--line);
  }
  #cmt .ch b{font-size:13.5px}
  #cmt .ch .n{font-size:11.5px;color:var(--dim);margin-left:6px}
  #cmt .ch .x{margin-left:auto;width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center}
  #cmt .ch .x svg{width:14px;height:14px}
  #cmt .cl{flex:1;overflow-y:auto;padding:10px 15px}
  #cmt .cl::-webkit-scrollbar{width:6px}
  #cmt .cl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  #cmt .ci{display:flex;gap:9px;margin-bottom:14px}
  #cmt .ci .av{width:30px;height:30px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(135deg,#fe2c55,#25f4ee);display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;color:#000}
  #cmt .ci .bd{flex:1;min-width:0}
  #cmt .ci .nm{font-size:12px;color:var(--dim);margin-bottom:3px}
  #cmt .ci .tx{font-size:13px;line-height:1.45;word-break:break-word}
  #cmt .empty{text-align:center;color:#4a4a52;font-size:12.5px;padding:44px 0}
  #cmt .cf{
    display:flex;gap:9px;padding:10px 15px 16px;border-top:1px solid var(--line);
    align-items:flex-end;
  }
  #cmt textarea{
    flex:1;height:38px;max-height:96px;resize:none;border-radius:9px;padding:10px 12px;
    background:rgba(255,255,255,.08);border:1px solid transparent;color:#fff;
    font-size:13px;font-family:inherit;outline:none;line-height:1.3;
  }
  #cmt textarea:focus{border-color:rgba(254,44,85,.5)}
  #cmt .send{
    height:38px;padding:0 17px;border-radius:9px;background:var(--pink);
    color:#fff;font-size:13px;font-weight:600;flex:0 0 auto;
  }
  #cmt .send:disabled{opacity:.4}

  /* ---------- 浮动提示 ---------- */
  #toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:60;
    background:rgba(0,0,0,.86);color:#fff;font-size:12.5px;padding:9px 17px;
    border-radius:20px;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;
    border:1px solid rgba(255,255,255,.12);
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* 双击点赞的心 */
  .heart{
    position:absolute;pointer-events:none;z-index:15;color:var(--pink);
    animation:heartpop .82s cubic-bezier(.2,.6,.3,1) forwards;
  }
  .heart svg{width:96px;height:96px;filter:drop-shadow(0 3px 16px rgba(254,44,85,.6))}
  @keyframes heartpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-18deg)}
    32%{opacity:1;transform:translate(-50%,-50%) scale(1.16) rotate(6deg)}
    72%{opacity:1;transform:translate(-50%,-56%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-92%) scale(.82)}
  }

  /* 空态 */
  #empty{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;z-index:5;color:var(--dim);
  }
  #empty svg{width:56px;height:56px;opacity:.4}
  #empty b{font-size:15px;color:#fff}
  #empty p{margin:0;font-size:12.5px;line-height:1.7;text-align:center}
  #empty a{color:var(--cyan);text-decoration:none}

  /* 快捷键提示 */
  #keys{
    position:fixed;left:14px;top:62px;z-index:9;font-size:11px;color:rgba(255,255,255,.34);
    line-height:1.85;transition:opacity .3s;pointer-events:none;
  }
  #keys.hide{opacity:0}
  #keys kbd{
    background:rgba(255,255,255,.12);border-radius:3px;padding:0 4px;
    font-family:inherit;font-size:10px;
  }
  @media (max-width:820px){
    :root{--grid-w:236px}
    #keys{display:none}
  }
</style>
</head>
<body>

<div id="stage"></div>

<div id="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20M7 4v5M17 4v5"/>
  </svg>
  <b>还没有下载好的视频</b>
  <p>回到 <a href="/">下载面板</a>，在抖音 / 快手 / B站 点收藏<br>下载完成后这里就能像刷抖音一样刷了</p>
</div>

<div class="top">
  <div class="brand"><i></i><span id="brandTxt">离线抖音</span></div>
  <div class="grow"></div>
  <div class="cnt" id="posTxt">0 / 0</div>
  <button class="tbtn" id="btnLoop" title="循环播放当前视频">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/>
      <path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/>
    </svg>
  </button>
  <button class="tbtn" id="btnAuto" title="自动连播（播完自动下一个）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 3l14 9-14 9V3z"/>
    </svg>
  </button>
  <button class="tbtn" id="btnMute" title="静音 (M)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      <path id="wave1" d="M15.5 8.5a5 5 0 010 7"/><path id="wave2" d="M18.5 5.5a9 9 0 010 13"/>
    </svg>
  </button>
  <button class="tbtn" id="btnGrid" title="视频网格 (G)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>
</div>

<div id="keys">
  <div><kbd>↑</kbd><kbd>↓</kbd> 切换视频</div>
  <div><kbd>空格</kbd> 暂停 / 播放</div>
  <div><kbd>M</kbd> 静音　<kbd>G</kbd> 网格</div>
  <div><kbd>F</kbd> 全屏　<kbd>D</kbd> 点赞</div>
</div>

<div id="grid">
  <div class="ghead">
    <div class="row1"><b>全部视频</b><span class="n" id="gCount">0</span></div>
    <input class="search" id="gSearch" placeholder="搜作者 / 文案 / ID…" autocomplete="off">
    <div class="chips" id="gChips">
      <button class="chip on" data-p="all">全部</button>
      <button class="chip" data-p="douyin">抖音</button>
      <button class="chip" data-p="kuaishou">快手</button>
      <button class="chip" data-p="bilibili">B站</button>
    </div>
    <div class="chips flags" id="gFlags">
      <button class="chip flag on" data-f="all">全部</button>
      <button class="chip flag" data-f="like">👍 已赞 <span class="cn" id="cnLike">0</span></button>
      <button class="chip flag" data-f="fav">⭐ 已藏 <span class="cn" id="cnFav">0</span></button>
      <button class="chip flag" data-f="follow">👤 已关注 <span class="cn" id="cnFollow">0</span></button>
    </div>
  </div>
  <div class="gbody" id="gBody"></div>
</div>

<button id="toggle" title="折叠 / 展开视频网格 (G)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M9 18l6-6-6-6"/>
  </svg>
</button>

<div id="cmt">
  <div class="ch">
    <b>评论</b><span class="n" id="cCount">0</span>
    <button class="x" id="cClose" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="cl" id="cList"></div>
  <div class="cf">
    <textarea id="cInput" placeholder="说点什么…（只存在本机，不会联网）" rows="1"></textarea>
    <button class="send" id="cSend" disabled>发送</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   离线抖音播放器
   - 数据全部来自本地 /api/library 与 /api/video（不联网）
   - 点赞 / 收藏 / 评论 / 关注 都存 localStorage，纯本机
   ===================================================================== */

const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

const stage   = $('#stage');
const grid    = $('#grid');
const gBody   = $('#gBody');
const cList   = $('#cList');
const cInput  = $('#cInput');
const cSend   = $('#cSend');

const LS = {
  like  : 'dyoff.like',      // {id:1}
  fav   : 'dyoff.fav',
  follow: 'dyoff.follow',
  cmt   : 'dyoff.cmt',       // {id:[{t,n}]}
  cfg   : 'dyoff.cfg',       // {grid:bool, mute:bool, auto:bool, loop:bool}
  pos   : 'dyoff.pos',       // 上次看到第几个
};

let ITEMS  = [];       // 全量视频库
let VIEW   = [];       // 过滤后（网格用）
let cur    = 0;        // 当前播放的 ITEMS 下标
let cfg    = {grid:true, mute:true, auto:true, loop:false};
let slides = [];       // 与 ITEMS 一一对应的 DOM
let dragging = false;  // 进度条拖动中


/* ---------------- 本地存储 ---------------- */
function load(k, dflt) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : dflt; }
  catch (e) { return dflt; }
}
function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
let LIKE   = load(LS.like, {});
let FAV    = load(LS.fav, {});
let FOLLOW = load(LS.follow, {});
let CMT    = load(LS.cmt, {});

/* ---------------- 小工具 ---------------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDur(ms) {
  if (!ms || ms < 0) return '';
  const s = Math.round(ms / 1000);
  const m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  return m + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
}
function fmtSize(b) {
  if (b >= 1 << 30) return (b / (1 << 30)).toFixed(2) + ' GB';
  if (b >= 1 << 20) return (b / (1 << 20)).toFixed(1) + ' MB';
  return Math.round(b / 1024) + ' KB';
}
/* 平台判定：文件名/id 形状推断（下载时没有单独记平台字段） */
function platOf(it) {
  const id = it.id || '';
  if (/^BV[0-9A-Za-z]{10}$/.test(id) || /^av\d+$/.test(id)) return 'bilibili';
  if (/^\d{18,20}$/.test(id)) return 'douyin';
  return 'kuaishou';
}
const PLAT_NAME = {douyin: '抖音', kuaishou: '快手', bilibili: 'B站'};
const PLAT_COLOR = {douyin: '#25f4ee', kuaishou: '#ff8a3d', bilibili: '#fb7299'};
const PLAT_LETTER = {douyin: '抖', kuaishou: '快', bilibili: 'B'};

let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1700);
}

/* ---------------- 图标 ---------------- */
const ICON = {
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-4.9-8-10.6A4.4 4.4 0 0112 7a4.4 4.4 0 018 3.4C20 16.1 12 21 12 21z"/></svg>',
  fav: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 011 1v17l-7-4.5L5 21V4a1 1 0 011-1z"/></svg>',
  cmt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 9.9 9.9 0 01-3.9-.8L3 21l1.7-4.4A8.3 8.3 0 013 11.5 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"/><path d="M12 16V3"/><path d="M7 8l5-5 5 5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9V3z"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/></svg>',
};

/* ---------------- 构建舞台 ---------------- */
function buildStage() {
  stage.innerHTML = '';
  slides = [];
  const frag = document.createDocumentFragment();
  ITEMS.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.dataset.i = String(i);
    el.innerHTML = `
      <video playsinline preload="none" poster=""></video>
      <div class="glass">${ICON.play}</div>
      <div class="rail">
        <div class="avatar">${esc((it.author || '?').slice(0, 1))}</div>
        <button class="act like" data-act="like">
          ${ICON.heart}<span class="n">${LIKE[it.id] ? '已赞' : '赞'}</span>
        </button>
        <button class="act fav" data-act="fav">
          ${ICON.fav}<span class="n">${FAV[it.id] ? '已藏' : '收藏'}</span>
        </button>
        <button class="act cmt" data-act="cmt">
          ${ICON.cmt}<span class="n">${(CMT[it.id] || []).length || '评论'}</span>
        </button>
        <button class="act share" data-act="share">
          ${ICON.share}<span class="n">分享</span>
        </button>
      </div>
      <div class="meta">
        <div class="who">
          <b>@${esc(it.author || '未知作者')}</b>
          <button class="follow${FOLLOW[it.author] ? ' on' : ''}" data-act="follow">
            ${FOLLOW[it.author] ? '已关注' : '关注'}
          </button>
        </div>
        <div class="desc" data-act="desc">${linkify(it.title || '（无文案）')}</div>
        <div class="music${cfg.mute ? ' pause' : ''}">
          ${ICON.music}<span class="t">${esc(it.music || ('原声 · ' + (it.author || '')))}</span>
        </div>
      </div>
      <div class="bar">
        <div class="track"><div class="buf"></div><div class="done"></div><div class="knob"></div></div>
        <div class="time">0:00</div>
      </div>`;
    frag.appendChild(el);
    slides.push(el);
  });
  stage.appendChild(frag);
  stage.querySelectorAll('.act').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); act(b.dataset.act); });
  });
  stage.querySelectorAll('.follow').forEach((b) => {
    b.addEventListener('click', (e) => { e.stopPropagation(); act('follow'); });
  });
  slides.forEach((el, i) => {
    const v = el.querySelector('video');
    const bar = el.querySelector('.bar');
    const track = bar.querySelector('.track');

    /* 单击暂停 / 双击点赞 */
    let clickTimer = 0, lastTap = 0;
    el.addEventListener('click', (e) => {
      if (e.target.closest('.rail, .bar, .meta .who, .meta .follow, .meta .desc')) return;
      const now = Date.now();
      if (now - lastTap < 300) {              // 双击
        clearTimeout(clickTimer);
        lastTap = 0;
        popHeart(el, e.clientX, e.clientY);
        if (!LIKE[ITEMS[i].id]) act('like');
        else popHeart(el, e.clientX, e.clientY);
      } else {
        lastTap = now;
        clickTimer = setTimeout(() => togglePlay(i), 260);
      }
    });

    /* 进度条 */
    let wasPlaying = false;
    const seekAt = (ev) => {
      const r = track.getBoundingClientRect();
      const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
      if (isFinite(v.duration) && v.duration > 0) {
        v.currentTime = p * v.duration;
        paintBar(i);
      }
    };
    bar.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      dragging = true;
      bar.classList.add('drag');
      wasPlaying = !v.paused;
      v.pause();
      bar.setPointerCapture(e.pointerId);
      seekAt(e);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seekAt(e); });
    bar.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      bar.classList.remove('drag');
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
      if (wasPlaying) v.play().catch(() => {});
    });

    v.addEventListener('loadedmetadata', () => { paintBar(i); });
    v.addEventListener('timeupdate', () => { if (i === cur) paintBar(i); });
    v.addEventListener('progress', () => {
      if (!v.buffered.length || !v.duration) return;
      const b = v.buffered.end(v.buffered.length - 1);
      bar.querySelector('.buf').style.width = (b / v.duration * 100) + '%';
    });
    v.addEventListener('play',  () => { el.classList.remove('paused'); });
    v.addEventListener('pause', () => { el.classList.add('paused'); });
    v.addEventListener('ended', () => {
      /* 只有"当前正在看的那一个"播完才推进。后台视频(用户已经切走、
         但解码还没停)播完不能触发 go(1) —— 否则它会把用户刚切到的位置
         拽回下一格。 */
      if (i !== cur) return;
      if (cfg.loop) { v.currentTime = 0; v.play().catch(() => {}); }
      else if (cfg.auto) go(1, true);
      else el.classList.add('paused');
    });
    v.addEventListener('error', () => {
      if (i === cur) toast('这个视频播不了（文件可能损坏或格式不支持）');
    });
    el.querySelector('.desc').addEventListener('click', (e) => {
      e.stopPropagation();
      e.currentTarget.classList.toggle('open');
    });
  });
}

/* 文案里的 #话题 高亮 */
function linkify(t) {
  return esc(t).replace(/(#[^\s#]+)/g, '<span class="tag">$1</span>');
}

function paintBar(i) {
  const el = slides[i];
  if (!el) return;
  const v = el.querySelector('video');
  const bar = el.querySelector('.bar');
  const d = v.duration;
  if (!isFinite(d) || d <= 0) return;
  const p = Math.max(0, Math.min(100, v.currentTime / d * 100));
  bar.querySelector('.done').style.width = p + '%';
  bar.querySelector('.knob').style.left = p + '%';
  bar.querySelector('.time').textContent =
    fmtTime(v.currentTime) + ' / ' + fmtTime(d);
}

/* ---------------- 播放控制 ---------------- */
function lazyLoad(i) {
  // 只给当前 ±1 挂 src，避免 80 个 video 同时抢 IO
  [i - 1, i, i + 1].forEach((k) => {
    if (k < 0 || k >= ITEMS.length) return;
    const v = slides[k] && slides[k].querySelector('video');
    if (!v || v.dataset.src) return;
    v.dataset.src = ITEMS[k].src;
    v.src = ITEMS[k].src;
    v.muted = cfg.mute;
  });
}

function unloadFar(i) {
  // 离得远的把 src 摘掉，释放解码器（80 个 4K 视频不摘内存会炸）
  slides.forEach((el, k) => {
    if (Math.abs(k - i) <= 2) return;
    const v = el.querySelector('video');
    if (!v || !v.dataset.src) return;
    v.pause();
    v.removeAttribute('src');
    delete v.dataset.src;
    v.load();
  });
}

function play(i) {
  const el = slides[i];
  if (!el) return;
  const v = el.querySelector('video');
  v.muted = cfg.mute;
  const p = v.play();
  if (p && p.catch) p.catch(() => {
    // 浏览器自动播放策略：静音才能自动播。静音也失败就提示一下
    if (!cfg.mute) { cfg.mute = true; syncMute(); v.muted = true; v.play().catch(() => {}); }
  });
  el.classList.remove('paused');
}

function pause(i) {
  const el = slides[i];
  if (!el) return;
  el.querySelector('video').pause();
  el.classList.add('paused');
}

function togglePlay(i) {
  const el = slides[i];
  if (!el) return;
  const v = el.querySelector('video');
  if (v.paused) play(i); else pause(i);
}

function go(delta, autoplay) {
  const n = cur + delta;
  if (n < 0) { toast('已经是第一个了'); return; }
  if (n >= ITEMS.length) { toast('已经到底了'); return; }
  /* 先把上一个暂停掉。否则它会在后台继续播, 播完触发 ended 里的
     cfg.auto 逻辑再 go(1) 一次, 把刚切好的位置又拉走 —— 实测按 ↑ 回去后
     ~1s 又自己跳回原来那一格(日志: pause@2340ms, 5ms 后 scroll 回到 900)。 */
  pause(cur);
  cur = n;
  lazyLoad(cur);
  /* 程序化切换必须用瞬时跳转, 不能用 behavior:'smooth'。
     原因: #stage 上有 scroll-snap-type: y mandatory。平滑滚动滚到半路
     (实测 900 -> 869)就被 snap 强制吸回原位, onScrolled 于是把 cur 改回去
     —— 表现就是按 ↑/↓ 键"没反应"。瞬时跳转一步到位, snap 无从干扰;
     抖音自己切视频也是瞬切, 观感一致。用户手滑时仍是原生 snap 吸附。 */
  stage.scrollTop = cur * stage.clientHeight;
  save(LS.pos, cur);
  updateTop();
  highlight();
  if (autoplay !== false) setTimeout(() => play(cur), 120);
}

function updateTop() {
  $('#posTxt').textContent = (cur + 1) + ' / ' + ITEMS.length;
  $('#brandTxt').textContent = ITEMS.length ? '离线抖音' : '离线抖音';
}

/* 滚动驱动：scroll-snap 结束后判断当前是哪个 */
let scrollTimer = 0;
stage.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(onScrolled, 110);
}, {passive: true});

function onScrolled() {
  if (!ITEMS.length) return;
  const h = stage.clientHeight || 1;
  const i = Math.round(stage.scrollTop / h);
  /* go()/jump() 走的是瞬时跳转(scrollTop = ...), 不会留下"滚到一半"的中间态,
     所以这里只管用户手滑/滚轮的情况, 不需要再区分程序化滚动。 */
  if (i < 0 || i >= ITEMS.length || i === cur) { highlight(); return; }
  pause(cur);
  cur = i;
  lazyLoad(cur);
  unloadFar(cur);
  save(LS.pos, cur);
  updateTop();
  highlight();
  play(cur);
}

/* ---------------- 动作 ---------------- */
function act(name) {
  const it = ITEMS[cur];
  if (!it) return;
  const el = slides[cur];
  if (name === 'like') {
    const on = !LIKE[it.id];
    if (on) LIKE[it.id] = 1; else delete LIKE[it.id];
    save(LS.like, LIKE);
    const b = el.querySelector('.act.like');
    b.classList.toggle('on', on);
    b.querySelector('.n').textContent = on ? '已赞' : '赞';
    popHeart(el, null, null);
    // 网格角标刷新
    const c = gBody.querySelector(`.card[data-id="${CSS.escape(it.id)}"] .likedot`);
    if (c) c.style.display = on ? 'block' : 'none';
    // 正开着标记筛选时, 取消/加上赞要立刻反映到网格里
    if (flagActive()) buildGrid(); else refreshFlagCounts();
  } else if (name === 'fav') {
    const on = !FAV[it.id];
    if (on) FAV[it.id] = 1; else delete FAV[it.id];
    save(LS.fav, FAV);
    const b = el.querySelector('.act.fav');
    b.classList.toggle('on', on);
    b.querySelector('.n').textContent = on ? '已藏' : '收藏';
    toast(on ? '已收藏到本地（只存本机）' : '取消收藏');
    if (flagActive()) buildGrid(); else refreshFlagCounts();
  } else if (name === 'cmt') {
    openCmt();
  } else if (name === 'share') {
    // 全部本机操作：能开文件所在目录，或复制一个 file:// 路径
    const urls = location.origin + it.src;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(urls)
        .then(() => toast('视频地址已复制（可粘到播放器里）'))
        .catch(() => toast(urls));
    } else {
      toast(urls);
    }
  } else if (name === 'follow') {
    const a = it.author || '';
    if (!a) return;
    const on = !FOLLOW[a];
    if (on) FOLLOW[a] = 1; else delete FOLLOW[a];
    save(LS.follow, FOLLOW);
    slides.forEach((s, k) => {
      if ((ITEMS[k].author || '') !== a) return;
      const b = s.querySelector('.follow');
      if (!b) return;
      b.classList.toggle('on', on);
      b.textContent = on ? '已关注' : '关注';
    });
    toast(on ? ('已关注 @' + a) : ('已取消关注 @' + a));
    if (flagActive()) buildGrid(); else refreshFlagCounts();
  }
}

function popHeart(el, x, y) {
  const h = document.createElement('div');
  h.className = 'heart';
  const r = el.getBoundingClientRect();
  h.style.left = (x == null ? r.width / 2 : x - r.left) + 'px';
  h.style.top = (y == null ? r.height / 2 : y - r.top) + 'px';
  h.innerHTML = ICON.heart;
  el.appendChild(h);
  setTimeout(() => h.remove(), 900);
}

/* ---------------- 评论（全本机） ---------------- */
function openCmt() {
  const it = ITEMS[cur];
  if (!it) return;
  renderCmt();
  $('#cmt').classList.add('open');
  setTimeout(() => cInput.focus(), 260);
}
function closeCmt() {
  $('#cmt').classList.remove('open');
  cInput.value = '';
  cSend.disabled = true;
}
function renderCmt() {
  const it = ITEMS[cur];
  if (!it) return;
  const list = CMT[it.id] || [];
  $('#cCount').textContent = list.length ? list.length + ' 条' : '';
  cList.innerHTML = list.length ? list.map((c) => `
    <div class="ci">
      <div class="av">我</div>
      <div class="bd"><div class="nm">我 · ${esc(c.t || '')}</div>
        <div class="tx">${esc(c.x || '')}</div></div>
    </div>`).join('') : '<div class="empty">还没有评论<br>写一条，只存在你本机</div>';
  cList.scrollTop = cList.scrollHeight;
}
function sendCmt() {
  const it = ITEMS[cur];
  const x = cInput.value.trim();
  if (!it || !x) return;
  (CMT[it.id] = CMT[it.id] || []).push({
    x: x, t: new Date().toLocaleString('zh-CN', {hour12: false}).slice(5, 16),
  });
  save(LS.cmt, CMT);
  cInput.value = '';
  cSend.disabled = true;
  renderCmt();
  const b = slides[cur].querySelector('.act.cmt .n');
  b.textContent = (CMT[it.id] || []).length;
  toast('评论已保存（只在本机）');
}
cInput.addEventListener('input', () => { cSend.disabled = !cInput.value.trim(); });
cInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCmt(); }
});
cSend.addEventListener('click', sendCmt);
$('#cClose').addEventListener('click', closeCmt);

/* ---------------- 网格 ---------------- */
function platLabel(it) { return platOf(it); }

function buildGrid() {
  const q = ($('#gSearch').value || '').trim().toLowerCase();
  const plat = ($('#gChips .chip.on') || {}).dataset ?
    ($('#gChips .chip.on').dataset.p || 'all') : 'all';
  const flag = ($('#gFlags .chip.on') || {}).dataset ?
    ($('#gFlags .chip.on').dataset.f || 'all') : 'all';
  VIEW = ITEMS.filter((it) => {
    // 两个维度是 AND: 平台 + 标记(赞/藏/关注) 可同时生效
    if (plat !== 'all' && platLabel(it) !== plat) return false;
    if (flag === 'like'   && !LIKE[it.id]) return false;
    if (flag === 'fav'    && !FAV[it.id]) return false;
    if (flag === 'follow' && !FOLLOW[it.author || '']) return false;
    if (!q) return true;
    return (it.author || '').toLowerCase().includes(q)
        || (it.title  || '').toLowerCase().includes(q)
        || (it.id     || '').toLowerCase().includes(q);
  });
  $('#gCount').textContent = VIEW.length + ' / ' + ITEMS.length;

  if (!VIEW.length) {
    const hint = (flag === 'like' && !Object.keys(LIKE).length)
      ? '还没有点赞过的视频<br><span style="opacity:.7">刷视频时点右边的 ❤ 就能标记</span>'
      : (flag === 'fav' && !Object.keys(FAV).length)
      ? '还没有收藏标记的视频<br><span style="opacity:.7">点右边的 ★ 就能标记</span>'
      : (flag === 'follow' && !Object.keys(FOLLOW).length)
      ? '还没有关注任何作者<br><span style="opacity:.7">点作者名旁边的「关注」</span>'
      : '没有匹配的视频';
    gBody.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#4a4a52;'
      + 'font-size:12px;padding:30px 0;line-height:1.9">' + hint + '</div>';
    refreshFlagCounts();
    return;
  }
  const frag = document.createDocumentFragment();
  VIEW.forEach((it) => {
    const realIdx = ITEMS.indexOf(it);
    const p = platOf(it);
    const c = document.createElement('div');
    c.className = 'card' + (realIdx === cur ? ' cur' : '');
    c.dataset.id = it.id;
    c.dataset.i = String(realIdx);
    c.title = (it.author ? '@' + it.author + '　' : '') + (it.title || '')
            + '\n' + it.id + (it.quality ? '　' + it.quality : '');
    c.innerHTML = `
      ${it.has_thumb
        ? `<img loading="lazy" src="/api/thumb?id=${encodeURIComponent(it.id)}" alt="">`
        : '<div class="ph">🎬</div>'}
      <div class="idx">${realIdx + 1}</div>
      ${it.duration ? `<div class="dur">${fmtDur(it.duration)}</div>` : ''}
      <div class="plat" style="background:${PLAT_COLOR[p]}">${PLAT_LETTER[p]}</div>
      <div class="lb">${esc(it.title || it.author || it.id)}</div>
      <div class="likedot" style="display:${LIKE[it.id] ? 'block' : 'none'};
        position:absolute;left:4px;bottom:4px;width:6px;height:6px;border-radius:50%;
        background:#fe2c55;box-shadow:0 0 6px #fe2c55"></div>`;
    c.addEventListener('click', () => jump(realIdx));
    frag.appendChild(c);
  });
  gBody.innerHTML = '';
  gBody.appendChild(frag);
  highlight();
  refreshFlagCounts();
}

/* 当前是否有"标记"筛选生效(赞/藏/关注) */
function flagActive() {
  const on = $('#gFlags .chip.on');
  return !!on && on.dataset.f && on.dataset.f !== 'all';
}

/* 每个筛选后面跟一个计数, 让用户一眼看到"我赞了多少" */
function refreshFlagCounts() {
  const tag = {like: LIKE, fav: FAV, follow: FOLLOW};
  for (const k of ['like', 'fav', 'follow']) {
    const el = $('#cn' + k[0].toUpperCase() + k.slice(1));
    if (el) el.textContent = Object.keys(tag[k]).length || '';
  }
}

function jump(i) {
  if (i < 0 || i >= ITEMS.length) return;
  pause(cur);
  cur = i;
  lazyLoad(cur);
  unloadFar(cur);
  /* 同样是瞬时跳转, 理由见 go() 里的注释 */
  stage.scrollTop = cur * stage.clientHeight;
  save(LS.pos, cur);
  updateTop();
  highlight();
  play(cur);
}

function highlight(which) {
  const target = (which == null ? cur : which);
  gBody.querySelectorAll('.card').forEach((c) => {
    c.classList.toggle('cur', Number(c.dataset.i) === target);
  });
  const curCard = gBody.querySelector('.card.cur');
  if (curCard && cfg.grid) {
    const r = curCard.getBoundingClientRect();
    const br = gBody.getBoundingClientRect();
    if (r.top < br.top || r.bottom > br.bottom) {
      curCard.scrollIntoView({block: 'nearest'});
    }
  }
}

$('#gSearch').addEventListener('input', buildGrid);
$('#gChips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  $$('#gChips .chip').forEach((c) => c.classList.toggle('on', c === b));
  buildGrid();
});

$('#gFlags').addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  $$('#gFlags .chip').forEach((c) => c.classList.toggle('on', c === b));
  buildGrid();
});

/* ---------------- 折叠 / 按钮 ---------------- */
function syncGrid() {
  grid.classList.toggle('hide', !cfg.grid);
  document.body.classList.toggle('grid-off', !cfg.grid);
  $('#btnGrid').classList.toggle('on', cfg.grid);
  save(LS.cfg, cfg);
}
$('#toggle').addEventListener('click', () => { cfg.grid = !cfg.grid; syncGrid(); });
$('#btnGrid').addEventListener('click', () => { cfg.grid = !cfg.grid; syncGrid(); });

function syncMute() {
  $('#btnMute').classList.toggle('on', cfg.mute);
  $('#wave1').style.display = cfg.mute ? 'none' : '';
  $('#wave2').style.display = cfg.mute ? 'none' : '';
  slides.forEach((el, k) => {
    const v = el.querySelector('video');
    if (v) v.muted = cfg.mute;
    const m = el.querySelector('.music');
    if (m) m.classList.toggle('pause', cfg.mute);
  });
  save(LS.cfg, cfg);
}
$('#btnMute').addEventListener('click', () => {
  cfg.mute = !cfg.mute; syncMute();
  toast(cfg.mute ? '已静音' : '已开声音');
});

function syncLoop() {
  $('#btnLoop').classList.toggle('on', cfg.loop);
  save(LS.cfg, cfg);
}
$('#btnLoop').addEventListener('click', () => {
  cfg.loop = !cfg.loop; syncLoop();
  toast(cfg.loop ? '循环播放当前视频' : '关闭循环');
});

function syncAuto() {
  $('#btnAuto').classList.toggle('on', cfg.auto);
  save(LS.cfg, cfg);
}
$('#btnAuto').addEventListener('click', () => {
  cfg.auto = !cfg.auto; syncAuto();
  toast(cfg.auto ? '播完自动下一个' : '播完停在当前');
});

/* ---------------- 键盘 ---------------- */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'arrowdown' || k === 'j') { e.preventDefault(); go(1); }
  else if (k === 'arrowup' || k === 'k') { e.preventDefault(); go(-1); }
  else if (k === ' ') { e.preventDefault(); togglePlay(cur); }
  else if (k === 'm') { cfg.mute = !cfg.mute; syncMute(); toast(cfg.mute ? '已静音' : '已开声音'); }
  else if (k === 'g') { cfg.grid = !cfg.grid; syncGrid(); }
  else if (k === 'd') { act('like'); }
  else if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  else if (k === 'escape') { closeCmt(); }
});

/* ---------------- 启动 ---------------- */
async function boot() {
  cfg = Object.assign({grid: true, mute: true, auto: true, loop: false},
                      load(LS.cfg, {}));

  let data = null;
  try {
    const r = await fetch('/api/library', {cache: 'no-store'});
    data = await r.json();
  } catch (e) {
    data = null;
  }
  ITEMS = (data && data.items) || [];

  if (!ITEMS.length) {
    $('#empty').style.display = 'flex';
    $('#grid').classList.add('hide');
    $('#toggle').style.display = 'none';
    updateTop();
    return;
  }

  // 按下载时间倒序（新的在前），跟抖音的推荐感接近
  ITEMS.sort((a, b) => (b.time || 0) - (a.time || 0));

  const last = Number(load(LS.pos, 0)) || 0;
  cur = Math.max(0, Math.min(ITEMS.length - 1, last));

  buildStage();
  syncGrid();
  syncMute();
  syncLoop();
  syncAuto();

  lazyLoad(cur);
  updateTop();
  buildGrid();
  stage.scrollTop = cur * stage.clientHeight;

  // 自动播放：默认静音，所以浏览器策略允许
  setTimeout(() => { play(cur); }, 180);

  // 短暂显示快捷键提示
  setTimeout(() => $('#keys').classList.add('hide'), 5200);

  // 窗口尺寸变化时重新对齐，避免滚动位置漂移
  let rz = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { stage.scrollTop = cur * stage.clientHeight; }, 120);
  });

  // 从后台切回来接着播
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { const v = slides[cur] && slides[cur].querySelector('video'); if (v && v.paused) play(cur); }
  });
}

boot();
</script>
